<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marie Evensen</title>
  <meta name="description" content="Portfolio of Marie Evensen">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="work">
  <!-- Soft fades so content disappears under the top and bottom edges -->
  <div class="fade top" aria-hidden="true"></div>
  <div class="fade bottom" aria-hidden="true"></div>

  <header class="corner tl">
    <button data-open="about">About</button>
    <a href="mailto:hello@example.com">Contact</a>
  </header>

  <a class="corner tc" href="#" data-view-link="work">Marie<br>Evensen</a>

  <nav class="corner tr toggle" aria-label="View">
    <button data-view-link="work" aria-pressed="true">Work</button>
    <button data-view-link="index" aria-pressed="false">Index</button>
  </nav>

  <div class="corner bl">Design &amp; web</div>
  <div class="corner br"><span>Norway <span class="soft" id="clock"></span></span></div>

  <!-- Work: one project after another down the middle -->
  <main class="work" id="work"></main>

  <!-- Index: plain list of projects -->
  <main class="index" id="index">
    <ul id="index-list"></ul>
  </main>

  <!-- Label that follows the cursor over a project -->
  <div class="label" id="label" aria-hidden="true"></div>

  <!-- About -->
  <section class="about" id="about" hidden>
    <div class="about-body">
      <p>Marie Evensen is a designer and developer making brands, websites and small digital tools. This text is a placeholder — write a few lines about yourself here.</p>
      <ul>
        <li><span>Email</span><a href="mailto:hello@example.com">hello@example.com</a></li>
        <li><span>GitHub</span><a href="https://github.com/marieevensen">@marieevensen</a></li>
        <li><span>LinkedIn</span><a href="#">—</a></li>
      </ul>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
